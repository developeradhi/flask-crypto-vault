<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v=3">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/zxcvbn/4.4.2/zxcvbn.js"></script>
</head>
<body class="login-body">
    <div class="background-animation"></div>
    <div class="login-glass glass">
        <div class="lock-icon">🔒</div>
        <h2 style="font-weight: 800; font-size: 2rem; margin-bottom: 5px;">New Password</h2>
        <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 20px;">Enter your new secure password.</p>
        
        <form action="/reset-password/{{ token }}" method="POST" class="login-form">
            <input type="password" name="password" id="password" class="input-field" placeholder="New Password" required>
            
            <div id="password-strength-container" style="text-align: left; margin-bottom: 15px; display: none;">
                <div style="height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; margin-bottom: 5px;">
                    <div id="password-strength-bar" style="height: 100%; width: 0%; transition: all 0.3s ease;"></div>
                </div>
                <div id="password-crack-time" style="font-size: 0.8rem; color: var(--text-muted);"></div>
            </div>
            
            <button type="submit" class="btn primary-btn w-full mt-3">Reset Password</button>
        </form>
    </div>
    
    <script>
        const pwdInput = document.getElementById('password');
        if (pwdInput && document.getElementById('password-strength-container')) {
            pwdInput.addEventListener('input', () => {
                const val = pwdInput.value;
                const container = document.getElementById('password-strength-container');
                if(!val) { container.style.display = 'none'; return; }
                container.style.display = 'block';
                
                const result = zxcvbn(val);
                const bar = document.getElementById('password-strength-bar');
                const timeLabel = document.getElementById('password-crack-time');
                
                const colors = ['#ef4444', '#f97316', '#eab308', '#84cc16', '#22c55e'];
                bar.style.width = ((result.score + 1) * 20) + '%';
                bar.style.background = colors[result.score];
                timeLabel.innerText = "Crack time: " + result.crack_times_display.offline_slow_hashing_1e4_per_second;
            });
        }
    </script>
</body>
</html>
