<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v=3">
</head>
<body class="login-body">
    <div class="background-animation"></div>
    <div class="login-glass glass">
        <div class="lock-icon">📧</div>
        <h2 style="font-weight: 800; font-size: 2rem; margin-bottom: 5px;">Reset Password</h2>
        <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 20px;">Enter your email to receive a secure reset link.</p>
        
        <form action="/forgot-password" method="POST" class="login-form">
            <input type="email" name="email" class="input-field" placeholder="Email Address" required>
            <button type="submit" class="btn primary-btn w-full mt-3">Send Reset Link</button>
        </form>
        
        <div style="margin-top: 20px; font-size: 0.9rem;">
            <a href="/login" style="color: var(--text-muted); text-decoration: none;">Back to Login</a>
        </div>
    </div>
</body>
</html>
